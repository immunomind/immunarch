name: Build documentation

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  # Root and dev share one deployment lock. PR builds use separate locks.
  group: ${{ github.event_name == 'pull_request' && format('immunarch-pages-pr-{0}', github.event.pull_request.number) || 'immunarch-pages' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: altdoc/requirements.txt
      - name: Install MkDocs
        run: |
          python -m venv .venv_altdoc
          .venv_altdoc/bin/python -m pip install --requirement altdoc/requirements.txt
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: local::.
          needs: website
      - name: Configure site version and URL
        env:
          DOCS_BRANCH: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^Version: //p' DESCRIPTION)
          test -n "$version"
          title="immunarch $version"
          if [ "$DOCS_BRANCH" = dev ]; then
            title="$title (dev)"
            sed -i 's#^site_url: https://immunarch.com/$#site_url: https://immunarch.com/dev/#' altdoc/mkdocs.yml
            sed -i 's#https://immunarch.com/#https://immunarch.com/dev/#g' altdoc/pkgdown.yml
          fi
          sed -i "s/^site_name: immunarch$/site_name: $title/" altdoc/mkdocs.yml
      - name: Build site
        run: altdoc::render_docs(freeze = FALSE, parallel = FALSE, verbose = TRUE)
        shell: Rscript {0}
      - name: Assemble root site and validate redirects
        if: github.ref != 'refs/heads/dev'
        run: python3 .github/pages/prepare_pages.py docs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-site
          path: docs
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_type == 'branch' &&
      (github.ref_name == github.event.repository.default_branch || github.ref_name == 'dev')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: documentation-site
          path: docs
      - name: Stage root site
        if: github.ref != 'refs/heads/dev'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          clean: true
          clean-exclude: dev
          force: false
          branch: gh-pages
          folder: docs
      - name: Stage development preview
        if: github.ref == 'refs/heads/dev'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          clean: true
          force: false
          branch: gh-pages
          folder: docs
          target-folder: dev

      - name: Check out the assembled site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          path: pages-site
          persist-credentials: false
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: pages-site
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
